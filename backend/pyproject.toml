[project]
name = "judges-said-backend"
version = "0.1.0"
description = "Judges Said — German labour-law precedent explorer, FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai>=2.31.0",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "tiktoken>=0.13.0",
    # Declared explicitly only to pin the CPU build — sentence-transformers would pull it in
    # anyway. On Linux the default PyPI torch drags in ~3 GB of NVIDIA CUDA wheels that a
    # CPU-only container can never use, which is pure image size and build time.
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# A deployed service, not a distributable library: nothing imports this by package name, so
# there is no wheel to build and no src/ layout to satisfy.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The app package lives at the project root, not in src/.
pythonpath = ["."]
testpaths = ["tests"]
