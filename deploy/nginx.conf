# nginx reverse proxy for the Judges Said backend.
#
# Install on the Hetzner server:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/judges-said
#   sudo ln -s /etc/nginx/sites-available/judges-said /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate — certbot rewrites this file to add the TLS lines and the
# :80 -> :443 redirect:
#   sudo certbot --nginx -d api.example.com
#   sudo systemctl enable --now certbot.timer     # renewal is not automatic without this

server {
    listen 80;
    listen [::]:80;

    # Replace with the real hostname before installing.
    server_name api.example.com;

    # Answers involve retrieval, an LLM call, grounding validation, and possibly one
    # regeneration. The 60s default cuts that off mid-flight.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Court decisions are long; a question plus history can exceed the 1 MB default.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The streaming endpoint. Without these three lines nginx buffers the whole response and
    # releases it at once: the UI shows nothing for the entire turn, then everything at once,
    # which looks exactly like a hang. This is the single easiest thing to get wrong here.
    location /chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        # Lets the app opt out of buffering at any other proxy in front of this one.
        proxy_set_header X-Accel-Buffering no;

        # SSE connections stay open for the length of a turn.
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CORS is handled by the application (app/main.py reads ALLOWED_ORIGINS), deliberately not
    # here. Adding CORS headers at both layers produces duplicates, which browsers reject.
}
